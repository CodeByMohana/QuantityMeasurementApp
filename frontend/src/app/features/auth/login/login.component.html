<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #e0eafc, #cfdef3);">
  <mat-card style="width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; background-color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <mat-card-header style="justify-content: center; margin-bottom: 20px;">
      <mat-card-title style="font-size: 28px; font-weight: 800; color: #1a1a1a;">Welcome Back</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column;">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="Ex. pat@example.com">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email address</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="margin-top: 10px;">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || loading" style="margin-top: 20px; padding: 24px; font-size: 16px;">
          <mat-spinner *ngIf="loading" diameter="20" style="display: inline-block; margin-right: 10px;"></mat-spinner>
          <span *ngIf="!loading">Log In</span>
        </button>
      </form>

      <div style="text-align: center; margin: 20px 0; color: gray;">— OR —</div>

      <button mat-stroked-button color="accent" (click)="loginWithGoogle()" style="width: 100%; padding: 24px; font-size: 16px;">
        Continue with Google
      </button>

      <div style="text-align: center; margin-top: 30px; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
        <p style="margin: 0; font-size: 15px; color: #444;">Don't have an account? <a routerLink="/auth/signup" style="color: #3f51b5; text-decoration: none; font-weight: bold;">Sign up</a></p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
