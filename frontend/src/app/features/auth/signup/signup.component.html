<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #e0eafc, #cfdef3);">
  <mat-card style="width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; background-color: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
    <mat-card-header style="justify-content: center; margin-bottom: 20px;">
      <mat-card-title style="font-size: 28px; font-weight: 800; color: #1a1a1a;">Create an Account</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column;">
        
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput type="text" formControlName="username" placeholder="Display Name">
          <mat-error *ngIf="signupForm.get('username')?.hasError('required')">Username is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="margin-top: 10px;">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="example@mail.com">
          <mat-error *ngIf="signupForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="signupForm.get('email')?.hasError('email')">Please enter a valid email address</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="margin-top: 10px;">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="signupForm.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="signupForm.get('password')?.hasError('minlength')">Must be at least 6 characters</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="signupForm.invalid || loading" style="margin-top: 20px; padding: 24px; font-size: 16px;">
          <mat-spinner *ngIf="loading" diameter="20" style="display: inline-block; margin-right: 10px;"></mat-spinner>
          <span *ngIf="!loading">Sign Up</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 30px; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
        <p style="margin: 0; font-size: 15px; color: #444;">Already have an account? <a routerLink="/auth/login" style="color: #3f51b5; text-decoration: none; font-weight: bold;">Log in</a></p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
